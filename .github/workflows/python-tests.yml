name: Python Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests

  objc-msgsend-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make smoke script executable
        run: chmod +x scripts/test_objc_msgsend_hook.sh scripts/test_objc_msgsend_hook_experimental.sh
      - name: Run objc_msgSend smoke test
        run: ./scripts/test_objc_msgsend_hook.sh

  objc-msgsend-experimental:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make experimental script executable
        run: chmod +x scripts/test_objc_msgsend_hook.sh scripts/test_objc_msgsend_hook_experimental.sh
      - name: Run objc_msgSend experimental test
        run: ./scripts/test_objc_msgsend_hook_experimental.sh

  batching-stress:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make stress script executable
        run: chmod +x scripts/test_batching_stress.sh
      - name: Run batched-writer stress test (text + binary)
        run: ./scripts/test_batching_stress.sh

  jailbreak-control:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Agent IPC and multi-process control tests
        run: |
          ./scripts/test_jailbreak_ipc.sh
          ./scripts/test_jailbreak_control.sh

  jailbreak-packages:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos prerequisites
        run: brew install ldid
      - name: Checkout Theos
        run: git clone --recursive --depth 1 https://github.com/theos/theos.git "${RUNNER_TEMP}/theos"
      - name: Build and inspect rootless and rootful packages
        env:
          THEOS: ${{ runner.temp }}/theos
        run: ./scripts/test_jailbreak_packages.sh
